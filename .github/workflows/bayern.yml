name: Aktualizovať kalendár FC Bayern München

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_bayern_calendar.py'
      - '.github/workflows/bayern.yml'
  schedule:
    - cron: '7 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: bayern-men-calendar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Načítať zápasy a TV program
        run: python build_bayern_calendar.py
      - name: Zverejniť aktualizovaný kalendár
        run: |
          git add public/bayern-muzi.ics public/bayern-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update FC Bayern men calendar"
            git pull --rebase origin main
            git push
          fi
