name: Aktualizovať kalendár Formuly 1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build_f1_calendar.py'
      - '.github/workflows/formula1.yml'
  schedule:
    - cron: '47 1,7,13,19 * * *'

permissions:
  contents: write

concurrency:
  group: formula1-calendar
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Načítať harmonogram a vytvoriť kalendár
        run: python build_f1_calendar.py
      - name: Zverejniť aktualizovaný kalendár
        run: |
          git add public/formula1.ics public/formula1-v2.ics public/formula1-status.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update Formula 1 calendar"
            git pull --rebase origin main
            git push
          fi
